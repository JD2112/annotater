name: python-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lock-consistency:
    name: uv.lock consistent with pyproject.toml and requirements exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check lock and generated requirements files
        run: |
          python -m pip install "uv==0.11.8"
          scripts/export_requirements.sh --check

      - name: Check generated docs example blocks
        run: python scripts/generate_semantic_examples.py --check

      - name: Check generated assembly documentation
        run: python scripts/generate_assembly_docs.py --check

  tests:
    name: pytest (Python 3.12, ${{ matrix.os }})
    # Python 3.12 is the currently tested and supported runtime. 3.13/3.14
    # satisfy requires-python but are NOT part of the tested CI matrix;
    # 3.10/3.11 cannot install the exact pins at all (e.g. numpy==2.5.3).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # System dependency: pybedtools uses the bedtools binary from PATH
      # (no embedded-binary mode; see docs/implementation-notes.md).
      - name: Install bedtools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bedtools
          bedtools --version

      - name: Install bedtools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bedtools
          bedtools --version

      # Install the exact graph recorded in uv.lock (--frozen: never
      # re-resolve or update the lock). Same lock the Docker image uses.
      # uv is pinned; UV_PYTHON keeps the venv on the tested 3.12.
      - name: Install Python dependencies (from uv.lock)
        env:
          UV_PYTHON: "3.12"
        run: |
          python -m pip install "uv==0.11.8"
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Record runtime versions
        run: |
          python - <<'EOF'
          import pybedtools, polars, polars_bio
          print("pybedtools", pybedtools.__version__)
          print("polars", polars.__version__)
          print("polars-bio", getattr(polars_bio, "__version__", "unknown"))
          EOF

      - name: Run test suite
        run: pytest

  frontend-tests:
    name: frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests and build
        working-directory: frontend
        run: npm test

  browser-regression:
    name: real-browser regression (two-tab revisions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Test the exact PR head commit (not a merge commit synthesized by the
      # event), and the exact pushed commit on main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record checked-out commit
        run: git rev-parse HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install bedtools
        run: |
          sudo apt-get update
          sudo apt-get install -y bedtools
          bedtools --version

      # Same locked Python graph as the pytest jobs. Playwright is added via
      # an ephemeral `uv run --with playwright==1.64.0` overlay so the project
      # lock stays unchanged.
      - name: Install Python dependencies (from uv.lock)
        env:
          UV_PYTHON: "3.12"
        run: |
          python -m pip install "uv==0.11.8"
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Build the React app from the exact commit under test; the real
      # FastAPI process serves frontend/dist at / during the test.
      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.64.0-chromium-${{ hashFiles('uv.lock') }}

      - name: Install Playwright Chromium
        run: uv run --with playwright==1.64.0 playwright install --with-deps chromium

      # ANNOTATER_BROWSER_REQUIRED turns a missing browser/build/bedtools into
      # a failure instead of a skip. The tests start and stop the real app
      # themselves, one isolated browser context (cookie jar) per scenario.
      - name: Run real-browser regression tests
        env:
          ANNOTATER_BROWSER_TESTS: "1"
          ANNOTATER_BROWSER_REQUIRED: "1"
          ANNOTATER_BROWSER_CHANNEL: bundled
          ANNOTATER_BROWSER_LOG_DIR: ${{ runner.temp }}/browser-logs
          ANNOTATER_BROWSER_TRACE_DIR: ${{ runner.temp }}/browser-traces
        run: |
          uv run --with playwright==1.64.0 pytest tests/test_browser_multi_tab.py -v --durations=10

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-diagnostics
          path: |
            ${{ runner.temp }}/browser-logs
            ${{ runner.temp }}/browser-traces
          if-no-files-found: ignore
          retention-days: 7

  docker-smoke:
    name: docker build + in-container smoke + benchmark smoke (linux/amd64)
    # ubuntu-latest is x86_64, so the amd64 image builds natively (no QEMU).
    # The macOS runner has no Docker daemon, so this job is Linux-only.
    # This job verifies the production image end-to-end without a registry:
    #   * scientific core (scripts/docker_smoke.sh: bedtools, engines, parity);
    #   * the served FastAPI/React app (scripts/docker_smoke_api.sh: startup,
    #     /health, static frontend, routes, two isolated sessions, export);
    #   * the scientific runtime with the network fully off
    #     (scripts/offline_smoke.py under `--network none`);
    #   * a small deterministic benchmark run whose parity gate fails the job
    #     if the two canonical engines disagree (PLAN Task 8).
    # The FULL benchmark (docs/benchmark.md) is deliberately NOT a CI gate:
    # performance numbers are reporting data, not pass/fail criteria, and
    # timing thresholds would be flaky on shared runners.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image (linux/amd64)
        run: docker build --platform linux/amd64 -t annotater:ci .

      - name: Scientific-core smoke (bedtools, engines, canonical parity)
        # NOTE: --entrypoint bash is required — the image ENTRYPOINT is the
        # FastAPI server (the Serve entry point), and plain `docker run ... bash ...`
        # would append the args to it and start the web server instead of the smoke.
        run: docker run --rm --entrypoint bash annotater:ci /app/scripts/docker_smoke.sh

      - name: Served-application smoke (startup, health, routes, sessions, export)
        run: docker run --rm --entrypoint bash annotater:ci /app/scripts/docker_smoke_api.sh

      - name: Offline scientific-runtime smoke (no network)
        run: docker run --rm --network none --entrypoint python annotater:ci /app/scripts/offline_smoke.py

      - name: Benchmark smoke (deterministic, parity-gated)
        # Single line: in a folded `run` scalar a trailing backslash is not a
        # shell line-continuation and would leave a literal space in the path.
        run: docker run --rm --entrypoint python annotater:ci /app/benchmarks/benchmark_engines.py --quick