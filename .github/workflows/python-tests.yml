name: python-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: pytest (Python 3.12, ${{ matrix.os }})
    # The exact dependency pins (see requirements.txt) require Python >= 3.12,
    # so 3.12 is the only supported matrix entry for now. Add 3.10/3.11 back
    # only if the pins are relaxed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # System dependency: pybedtools uses the bedtools binary from PATH
      # (no embedded-binary mode; see docs/implementation-notes.md).
      - name: Install bedtools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bedtools
          bedtools --version

      - name: Install bedtools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bedtools
          bedtools --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Record runtime versions
        run: |
          python - <<'EOF'
          import pybedtools, polars, polars_bio
          print("pybedtools", pybedtools.__version__)
          print("polars", polars.__version__)
          print("polars-bio", getattr(polars_bio, "__version__", "unknown"))
          EOF

      - name: Run test suite
        run: pytest