name: release-ghcr

# Controlled publication of release-candidate (and later final-release)
# images to GitHub Container Registry.
#
# Publishing an image on every push is deliberately NOT configured: images
# are published only on an explicit `workflow_dispatch`, so every published
# image corresponds to a commit that a maintainer intentionally verified.
#
# The exact dispatched commit is published as two tags that resolve to the
# same image digest:
#   ghcr.io/pyrevo/annotater:<image_tag>      (e.g. 0.1.0-rc1)
#   ghcr.io/pyrevo/annotater:sha-<shortsha>   (per-commit traceability)
#
# `latest` is rejected: the SciLifeLab Serve deployment reference must always
# be an explicit, immutable tag (see docs/deployment.md).
#
# Platform: linux/amd64 only. The pinned Polars-Bio release publishes
# manylinux x86_64 wheels only; multi-arch publishing is out of scope until
# the dependency is revalidated (see docs/deployment.md).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (release candidate or final release), e.g. 0.1.0-rc1"
        required: true
        default: "0.1.0-rc1"
        type: string

# Minimal permissions: read the source, write the container package.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build (linux/amd64), smoke, push to GHCR
    runs-on: ubuntu-latest # x86_64: the amd64 image builds natively (no QEMU)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify publication ref is main
        # The image must correspond to a commit that passed CI on main.
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release images may only be published from 'main' (current ref: ${{ github.ref }})."
          exit 1

      - name: Reject non-immutable tags
        run: |
          case "${{ inputs.image_tag }}" in
            latest|main|main-*)
              echo "::error::Tag '${{ inputs.image_tag }}' is not allowed. Use an explicit, immutable tag (e.g. 0.1.0-rc1)."
              exit 1
              ;;
          esac
          echo "Publishing tag: ${{ inputs.image_tag }}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=sha-{{sha}}
          # Standard OCI labels. No release date or DOI is fabricated;
          # the revision label carries the exact commit SHA.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
            org.opencontainers.image.licenses=BSD-3-Clause
            org.opencontainers.image.title=AnnotateR
            org.opencontainers.image.description=Graphical interface to annotate genomic coordinates (Bedtools / Polars-Bio parity)

      - name: Build image (linux/amd64, local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: In-container smoke (imports, bedtools, engines, annotation, health)
        # Pre-push gate: the candidate image must pass the same smoke CI
        # runs (scripts/docker_smoke.sh) before anything reaches the
        # registry. --entrypoint bash overrides the Streamlit ENTRYPOINT.
        run: docker run --rm --entrypoint bash ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD) /app/scripts/docker_smoke.sh

      - name: Push both tags
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD)